name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Vite inlines these at build time, so they must exist as repo secrets.
      # Add them under Settings -> Secrets and variables -> Actions.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # The admin is a plain static page, so it is copied into the build
      # output rather than bundled. config.js is written here from secrets
      # so it never has to be committed.
      - name: Add admin app
        run: |
          mkdir -p dist/admin
          cp admin/index.html dist/admin/index.html
          cat > dist/admin/config.js <<CONF
          window.PORTFOLIO_CONFIG = {
            SUPABASE_URL: '${{ secrets.VITE_SUPABASE_URL }}',
            SUPABASE_ANON_KEY: '${{ secrets.VITE_SUPABASE_ANON_KEY }}',
            SITE_URL: '/'
          };
          CONF

      # GitHub Pages serves 404.html for unknown paths; this keeps the
      # single-page app working on deep links.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
