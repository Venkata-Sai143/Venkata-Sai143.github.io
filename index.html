  <body>
    <div id="root"></div>

    <script>
      (function () {
        function hideEditBtn() {
          document.querySelectorAll('button, a, [role="button"]').forEach(function (el) {
            var text = (el.textContent || '')
              .replace(/\s+/g, ' ')
              .trim()
              .toLowerCase();

            if (text.includes('edit portfolio')) {
              el.remove();
            }
          });
        }

        hideEditBtn();

        new MutationObserver(hideEditBtn).observe(document.documentElement, {
          childList: true,
          subtree: true
        });
      })();
    </script>
  </body>
