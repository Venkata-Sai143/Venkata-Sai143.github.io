      #skills .dyn-skill-chip:hover { background: #ff2b2b; color: #fff; transform: translateY(-2px); }
      /* Expertise: drop the 01/02/03/04 number badges and the decorative

      #expertise h2 > svg { display: none !important; }
      /* Premium motion polish: smoother anchor scrolling + a refined

         (scroll-reveal entrances and all hover/transition-all effects),
         without touching layout, colors or structure. */
      html { scroll-behavior: smooth; }
      [data-aos] { transition-timing-function: cubic-bezier(.16,1,.3,1) !important; }
      .transition-all, .transition-colors, .transition-transform, .transition-opacity, .transition-shadow {
        transition-timing-function: cubic-bezier(.16,1,.3,1) !important;
      }
      /* Accessibility: respect reduced-motion preference (effectively turns

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
          scroll-behavior: auto !important;

      a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid #ff2b2b !important;
        outline-offset: 3px !important;
        border-radius: 4px;
      }
      /* Scroll progress bar across the very top of the page. */
      .scroll-progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #ff2b2b, #ff6b35); transform-origin: left; transform: scaleX(0); z-index: 9999; pointer-events: none; }
      /* Reveal-on-scroll for dynamically added cards (Projects, Certificates). */
      .reveal-pre { opacity: 0; transform: translateY(28px); transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); }
      .reveal-pre.reveal-in { opacity: 1; transform: translateY(0); }
      @media (prefers-reduced-motion: reduce) { .reveal-pre { opacity: 1; transform: none; transition: none; } }
      /* Thin, branded scrollbar. */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #0b0b0b; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(#ff2b2b, #a80000); border-radius: 10px; border: 2px solid #0b0b0b; }
      ::-webkit-scrollbar-thumb:hover { background: #ff2b2b; }
      html { scrollbar-width: thin; scrollbar-color: #ff2b2b #0b0b0b; }
      /* Card hover polish — lift + glow, same colors/shapes already in use. */
      #projects .dyn-project-card { transition: transform .45s cubic-bezier(.16,1,.3,1), box-shadow .45s cubic-bezier(.16,1,.3,1), border-color .45s ease !important; }
      #projects .dyn-project-card:hover { transform: translateY(-8px) !important; box-shadow: 0 30px 60px rgba(229,43,43,.28) !important; border-color: rgba(229,43,43,.55) !important; }

      #certificates .cert-card:hover { transform: translateY(-8px) !important; box-shadow: 0 2rem 4rem rgba(0,0,0,.4) !important; }
      #experience .experience-card { transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s cubic-bezier(.16,1,.3,1) !important; }
      #experience .experience-card:hover { transform: translateY(-6px) !important; box-shadow: 0 1.5rem 3rem rgba(0,0,0,.12) !important; }
      /* Resume gate: "Download Resume" button + details popup. */
      .rg-overlay { position: fixed; inset: 0; z-index: 10000; display: none; align-items: center; justify-content: center; padding: 1rem; background: rgba(0,0,0,.65); backdrop-filter: blur(6px); }

      @keyframes rgIn { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
      .rg-box h3 { margin: 0 0 .35rem; font-size: 1.4rem; font-weight: 900; }
      .rg-box p.rg-sub { margin: 0 0 1.25rem; font-size: .85rem; color: rgba(255,255,255,.6); }
      .rg-box label { display: block; margin: .8rem 0 .3rem; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.7); }
      .rg-box input[type=text], .rg-box input[type=tel], .rg-box input[type=email] { width: 100%; box-sizing: border-box; padding: .8rem .95rem; border-radius: .75rem; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; font-size: .95rem; outline: none; transition: border-color .2s ease; }
      .rg-box input:focus { border-color: #ff2b2b; }

      .rg-box button.rg-go:hover { filter: brightness(1.1); transform: translateY(-1px); }
      .rg-box button.rg-go:disabled { opacity: .55; cursor: wait; }

  <body>
    <div id="root"></div>
    <script>
      (() => {
        // Filled in by /config.js (window.PORTFOLIO_CONFIG), the same file the
        // admin panel uses — SUPABASE_URL and SUPABASE_ANON_KEY.
        const CFG = window.PORTFOLIO_CONFIG || {};
        const hasSupabase = !window.__noconfig && CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes('YOUR-PROJECT') &&
          CFG.SUPABASE_ANON_KEY && typeof supabase !== 'undefined';

        const withTimeout = (promise, ms) => Promise.race([
          promise,
          new Promise((resolve) => setTimeout(() => resolve(null), ms))
        ]);

        // Fetches editable content from Supabase (expertise, skills, experiences,
        // projects, certificates). Each key resolves to an array from the database,
        // or null (meaning: keep the section's built-in content, untouched).
        const fetchDynamicContent = async () => {
          const empty = { expertise: null, skills: null, experiences: null, projects: null, certificates: null, profile: null };
          if (!hasSupabase) return empty;
          try {
            const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
            const results = await withTimeout(Promise.all([
              sb.from('expertise').select('*').eq('is_published', true).order('sort_order'),
              sb.from('skills').select('*').eq('is_published', true).order('sort_order'),
              sb.from('experiences').select('*').eq('is_published', true).order('sort_order'),
              sb.from('projects').select('*').eq('is_published', true).order('sort_order'),
              sb.from('certificates').select('*').eq('is_published', true).order('sort_order'),
              sb.from('profiles').select('*').eq('singleton', true).limit(1)
            ]), 4000) || [null, null, null, null, null, null];
            const [expertiseRes, skillsRes, experiencesRes, projectsRes, certsRes, profileRes] = results;

            // Group flat skill rows into { category, skills: [name, …] } for rendering.
            const skillRows = skillsRes && !skillsRes.error && skillsRes.data?.length ? skillsRes.data : null;
            let skillGroups = null;
            if (skillRows) {
              const order = [];
              const byCategory = {};
              skillRows.forEach((row) => {
                if (!byCategory[row.category]) { byCategory[row.category] = []; order.push(row.category); }
                byCategory[row.category].push(row.name);
              });
              skillGroups = order.map((category) => ({ category, skills: byCategory[category] }));
            }

            return {
              expertise: expertiseRes && !expertiseRes.error && expertiseRes.data?.length ? expertiseRes.data : null,
              skills: skillGroups,
              experiences: experiencesRes && !experiencesRes.error && experiencesRes.data?.length ? experiencesRes.data : null,
              projects: projectsRes && !projectsRes.error && projectsRes.data?.length ? projectsRes.data : null,
              certificates: certsRes && !certsRes.error && certsRes.data?.length ? certsRes.data : null,
              profile: profileRes && !profileRes.error && profileRes.data?.length ? profileRes.data[0] : null
            };
          } catch (e) {
            return empty;
          }
        };

        const formatPeriod = (start, end, current) => {
          const fmt = (d) => d ? new Date(d).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : '';
          if (!start) return '';
          return `${fmt(start)} — ${current ? 'Present' : (fmt(end) || 'Present')}`;
        };

        // ---- Premium motion polish (scroll progress bar, smooth scroll,
        // magnetic buttons, reveal-on-scroll) — pure visual polish layered on
        // top of the existing design, nothing moved or restyled. Runs once,
        // independent of Supabase data. ----
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('reveal-in');
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

        // Used by the dynamic sections above (Projects, Certificates) to
        // fade+slide each card in as it scrolls into view — the site's own
        // AOS library never sees nodes added after the page first mounts,
        // so this is a small independent observer instead.
        const observeReveal = (el, delayMs) => {
          el.classList.add('reveal-pre');
          if (delayMs) el.style.transitionDelay = delayMs + 'ms';
          revealObserver.observe(el);
        };

        let motionApplied = false;
        const applyPremiumMotion = () => {
          if (motionApplied) return;
          const nav = document.querySelector('nav');
          const hero = document.querySelector('#home');
          if (!nav || !hero) return;
          motionApplied = true;

          document.documentElement.style.scrollBehavior = 'smooth';

          // Thin progress bar across the top, filling as the page is scrolled.
          const progress = document.createElement('div');
          progress.className = 'scroll-progress';
          document.body.appendChild(progress);
          const updateProgress = () => {
            const h = document.documentElement;
            const scrolled = h.scrollTop / ((h.scrollHeight - h.clientHeight) || 1);
            progress.style.transform = `scaleX(${Math.min(1, Math.max(0, scrolled))})`;
          };
          document.addEventListener('scroll', updateProgress, { passive: true });
          updateProgress();

          // Subtle magnetic pull toward the cursor on primary CTA buttons.
          const magneticTargets = [nav.querySelector('a[href="#contact"].rounded-full')]
            .concat([...hero.querySelectorAll('a.rounded-full')])
            .filter(Boolean);
          magneticTargets.forEach((el) => {
            el.style.willChange = 'transform';
            el.addEventListener('mousemove', (e) => {
              const rect = el.getBoundingClientRect();
              const x = e.clientX - rect.left - rect.width / 2;
              const y = e.clientY - rect.top - rect.height / 2;
              el.style.transform = `translate(${x / 8}px, ${y / 8}px)`;
            });
            el.addEventListener('mouseleave', () => { el.style.transform = ''; });
          });
        };

        // ---- Profile text (hero, About, Expertise heading, Skills heading, page
        // title). Each field is only touched when Supabase has a non-empty value
        // for it, so anything left blank in the admin keeps the site's built-in
        // wording. Design/markup is never changed — only the words. Re-runs are
        // safe: it re-applies whenever a section appears or the text differs. ----
        const setText = (el, val) => { if (el && val && el.textContent !== val) el.textContent = val; };
        const applyProfile = (profile) => {
          if (!profile) return;
          const q = (sel) => document.querySelector(sel);
          // Hero
          setText(q('#home h1 span'), profile.name);
          setText(q('#home p.leading-relaxed'), profile.short_bio);
          const heroA = q('#home a[href="#projects"], #home a[data-cta="1"]');
          const heroB = q('#home a[href="#contact"], #home a[data-cta="2"]');
          if (heroA) { heroA.dataset.cta = '1'; setText(heroA, profile.hero_cta_primary_label); if (profile.hero_cta_primary_href) heroA.setAttribute('href', profile.hero_cta_primary_href); }
          if (heroB) { heroB.dataset.cta = '2'; setText(heroB, profile.hero_cta_secondary_label); if (profile.hero_cta_secondary_href) heroB.setAttribute('href', profile.hero_cta_secondary_href); }
          // About
          setText(q('#about h2'), profile.about_heading);
          setText(q('#about p.leading-relaxed'), profile.about);
          // Expertise heading block
          const ex = q('#expertise');
          if (ex) {
            setText(ex.querySelector('[data-aos="fade-up"] > div'), profile.expertise_badge);
            const h2 = ex.querySelector('h2');
            const tn = h2 && [...h2.childNodes].find((n) => n.nodeType === 3);
            if (tn && profile.expertise_heading && tn.textContent !== profile.expertise_heading) tn.textContent = profile.expertise_heading;
            setText(ex.querySelector('[data-aos="fade-up"] > p'), profile.expertise_subtext);
          }
          // Skills heading (the dynamic skills block reads profile.skills_heading itself)
          const sk = q('#skills');
          if (sk && !sk.classList.contains('dynamic-skills')) setText(sk.querySelector('h2'), profile.skills_heading);
          if (profile.meta_title && document.title !== profile.meta_title) document.title = profile.meta_title;
        };

        // ---- Experience (any number of cards — not capped at 3 anymore).
        // We clone the first real card as a style template (so fonts, spacing,
        // hover effects etc. stay pixel-identical), then build as many copies
        // as there are rows, instead of only filling the 3 slots React renders. ----
        const applyExperience = (dynamicExperiences) => {
          const experience = document.querySelector('#experience');
          if (!experience || experience.dataset.resumeUpdated) return;
          experience.dataset.resumeUpdated = 'true';
          const label = experience.querySelector('span');
          const heading = experience.querySelector('h2');
          if (label) label.style.color = '#ff2b2b';
          if (heading) heading.style.color = '#000';
          const container = experience.querySelector(':scope > div > div:last-child');
          if (!container || !container.children.length) return;
          const template = container.children[0].cloneNode(true); // real card markup, used as a stamp
          const fallback = [
            { period: 'DEC 2025 - APR 2026', chip: 'Operations & Dispatch', title: 'Supervisor', company: 'Mahindra Logistics Limited (Zepto)', points: ['Led daily warehouse operations and supervised staff, ensuring smooth functioning of a high-volume quick-commerce fulfillment center.', 'Drove dispatch planning with transporters, maintaining consistent on-time delivery performance.', 'Analyzed daily operational data in Advanced Excel to prepare reports tracking productivity, stock accuracy and dispatch performance.', 'Maintained accurate warehouse records, improving inventory reliability and reducing reporting errors across daily operations.'] },
            { period: 'AUG 2023 - SEP 2025', chip: 'WMS & Logistics', title: 'System Operator', company: 'Ratnadeep Retail Pvt Ltd', points: ['Generated accurate, GST-compliant E-Way Bills on a daily basis, ensuring smooth and uninterrupted movement of goods.', 'Tracked stock and dispatch data using WMS and Suvega Tracker to maintain stock accuracy.', 'Analyzed and prepared daily and monthly MIS reports in Advanced Excel to support management decisions on stock and dispatch.', 'Collaborated with transporters, store teams and warehouse staff to keep daily dispatch operations consistently on schedule.'] },
            { period: 'AUG 2026 - PRESENT', chip: 'Data Analytics', title: 'Data Analyst Training', company: 'Guided program with trainer support', points: ['Completed modules in Advanced Excel and Power BI (DAX, data modeling, dashboard design); currently developing SQL skills, with Python, Tableau and Statistics modules upcoming.', 'Publishing practical projects on GitHub as each module is completed.'] }
          ];
          const rows = (dynamicExperiences && dynamicExperiences.length)
            ? dynamicExperiences.map((r) => ({
                period: r.period_label || formatPeriod(r.start_date, r.end_date, r.is_current),
                chip: (r.tools && r.tools[0]) || r.location || '',
                title: r.job_title,
                company: r.company,
                points: (r.responsibilities && r.responsibilities.length) ? r.responsibilities : (r.description ? [r.description] : [])
              }))
            : fallback;
          container.innerHTML = '';
          rows.forEach((entry) => {
            const card = template.cloneNode(true);
            card.classList.add('experience-card');
            const spans = card.querySelectorAll('span');
            const title = card.querySelector('h3');
            const paragraphs = card.querySelectorAll('p');
            if (spans[0]) { spans[0].textContent = entry.period; spans[0].classList.add('experience-period'); }
            if (spans[1]) spans[1].classList.add('experience-tag');
            if (spans[2]) { spans[2].textContent = entry.chip; spans[2].classList.add('experience-chip'); }
            if (title) { title.textContent = entry.title; title.classList.add('experience-title'); }
            if (paragraphs[0]) { paragraphs[0].textContent = entry.company; paragraphs[0].classList.add('experience-company'); }
            if (paragraphs[1]) {
              const points = document.createElement('ul');
              points.className = 'experience-bullets';
              entry.points.forEach((point) => { const item = document.createElement('li'); item.textContent = point; points.appendChild(item); });
              paragraphs[1].replaceWith(points);
            } else {
              const points = document.createElement('ul');
              points.className = 'experience-bullets';
              entry.points.forEach((point) => { const item = document.createElement('li'); item.textContent = point; points.appendChild(item); });
              card.appendChild(points);
            }
            container.appendChild(card);
          });
        };

        // ---- Expertise ("My Expertise" cards). Only touched when Supabase has
        // data — this section was never customized before, so with no data it's
        // left exactly as the site already renders it (4 dotted-path cards).
        // With data, the SAME dotted-path card look/rotation/zig-zag is kept —
        // the first 4 cards reuse the site's original 4 hand-tuned positions,
        // and any extra cards repeat that same zig-zag pattern further down
        // the page (the decorative dotted line itself only covers the
        // original span — extra cards sit below it in the same card style).
        // An admin can also override any card's exact spot by setting its own
        // position_class/aos_type/aos_delay in Supabase (the columns the
        // original schema reserved for this). ----
        const stripPositionClasses = (className) => className.split(/\s+/).filter((cls) => {
          return cls
            && !/^(md:)?absolute$/.test(cls)
            && !/-?(top|bottom|left|right)-/.test(cls)
            && !/rotate/.test(cls)
            && cls !== 'z-10';
        }).join(' ');

        // Right-side cards use a percentage (scales fine — they never get near
        // the left-aligned intro text column). Left-side cards instead use a
        // fixed pixel offset: the intro text column is a fixed 450px wide, so
        // a percentage offset (what the original design used) shrinks below
        // that at narrower/in-between screen widths and the card ends up
        // overlapping the text — a fixed px clears it at every width.
        const EXPERTISE_POSITIONS = [
          { top: 10,   side: 'right', pct: 10,           rotate: 'rotate-2 md:rotate-6',    aosType: 'fade-left',  aosDelay: '100' },
          { top: 450,  side: 'left',  px: 480,           rotate: '-rotate-2 md:-rotate-6',  aosType: 'fade-right', aosDelay: '200' },
          { top: 700,  side: 'right', pct: 15,           rotate: 'rotate-1 md:rotate-3',    aosType: 'fade-left',  aosDelay: '300' },
          { top: 1050, side: 'left',  px: 480,           rotate: '-rotate-1 md:-rotate-3',  aosType: 'fade-right', aosDelay: '400' }
        ];
        const EXPERTISE_CYCLE_HEIGHT = 1400; // vertical space one full zig-zag group needs

        const applyExpertise = (dynamicExpertise) => {
          const expertise = document.querySelector('#expertise');
          if (!expertise || expertise.dataset.resumeUpdated || !dynamicExpertise || !dynamicExpertise.length) return;
          expertise.dataset.resumeUpdated = 'true';

          const cardTitles = [...expertise.querySelectorAll('h3')];
          if (!cardTitles.length) return;
          const originalCard = cardTitles[0].closest('[data-aos]');
          if (!originalCard) return;
          const container = originalCard.parentElement;
          if (!container) return;

          // Base styling (shape, shadow, colors) with position/rotation classes
          // stripped out, so each card below can get its own position re-applied.
          const baseClassName = stripPositionClasses(originalCard.className) + ' z-10';
          const template = originalCard.cloneNode(true);

          // Tailwind's CSS is a prebuilt stylesheet — only class names that
          // literally appeared in the original source got compiled. The 4
          // original top-[Npx]/left-[%]/right-[%] classes work; any NEW value
          // we need for card 5+ (or the narrower md-only 5% offset, which can
          // overlap the intro text at in-between widths) has no matching rule
          // or isn't safe to reuse — so position is set through a small
          // injected <style> block instead of relying on Tailwind classes.
          let cssRules = '';
          container.innerHTML = '';
          let maxTop = 1050;
          dynamicExpertise.forEach((row, index) => {
            const card = template.cloneNode(true);
            let rotate; let aosType; let aosDelay; let topPx; let side; let pct; let px;
            if (row.position_class) {
              rotate = (row.position_class.match(/-?rotate-\S+/g) || []).join(' ');
              aosType = row.aos_type || 'fade-up';
              aosDelay = row.aos_delay || String(100 + index * 100);
              const topMatch = /top-\[(\d+)px\]/.exec(row.position_class);
              topPx = topMatch ? parseInt(topMatch[1], 10) : index * 350;
              const sideMatch = /(left|right)-\[(\d+)%\]/.exec(row.position_class);
              side = sideMatch ? sideMatch[1] : (index % 2 === 0 ? 'right' : 'left');
              pct = sideMatch ? parseInt(sideMatch[2], 10) : 15;
              px = side === 'left' ? 480 : undefined; // same overlap-safe clearance as the defaults
            } else {
              const base = EXPERTISE_POSITIONS[index % 4];
              const cycle = Math.floor(index / 4);
              topPx = base.top + cycle * EXPERTISE_CYCLE_HEIGHT;
              rotate = base.rotate;
              side = base.side;
              pct = base.pct;
              px = base.px;
              aosType = base.aosType;
              aosDelay = base.aosDelay;
            }
            if (topPx > maxTop) maxTop = topPx;
            const posId = `expertise-pos-${index}`;
            const sideValue = px != null ? `${px}px` : `${pct}%`;
            cssRules += `@media (min-width:768px){ #expertise .${posId}{ top:${topPx}px !important; ${side}:${sideValue} !important; ${side === 'left' ? 'right' : 'left'}:auto !important; } }`;
            card.className = baseClassName + ' md:absolute ' + rotate + ' ' + posId;
            card.classList.add('aos-init', 'aos-animate'); // show immediately, no scroll-trigger dependency
            card.setAttribute('data-aos', aosType);
            card.setAttribute('data-aos-delay', aosDelay);

            const h3 = card.querySelector('h3');
            if (h3) h3.textContent = row.title;
            const numberEl = card.querySelector('span');
            if (numberEl) numberEl.textContent = row.number;
            const textEl = card.querySelector('p');
            if (textEl) textEl.textContent = row.text;
            container.appendChild(card);
          });
          if (cssRules) {
            const styleTag = document.createElement('style');
            styleTag.textContent = cssRules;
            document.head.appendChild(styleTag);
          }

          // Grow the section (desktop only — mobile already flows naturally)
          // so extra cards below the original 4 have room and nothing overlaps.
          if (window.matchMedia('(min-width: 768px)').matches) {
            const totalHeight = maxTop + 420;
            let node = container;
            while (node && node !== expertise) {
              if (node.className && node.className.includes('md:h-[')) node.style.height = totalHeight + 'px';
              node = node.parentElement;
            }
          }
        };

        // ---- Projects (2 editable slots out of the fixed desktop+mobile layout;
        // always applies, same as before Supabase existed) ----
        // ---- Projects. With no Supabase data, left exactly as the site
        // already renders it (the animated 3D card stack, 2 editable slots).
        // With data, that stack — built for a fixed number of slots — is
        // replaced with a plain grid, cloned from a real card so the card
        // styling (dark theme, red accents, tag chips, link) stays identical,
        // supporting any number of projects. ----
        const applyProjects = (dynamicProjects) => {
          const projects = document.querySelector('#projects');
          if (!projects || projects.dataset.resumeUpdated) return;
          if (!dynamicProjects || !dynamicProjects.length) { projects.dataset.resumeUpdated = 'true'; return; }
          projects.dataset.resumeUpdated = 'true';

          const cardEls = [...projects.querySelectorAll('h3')]
            .map((h3) => h3.closest('div[class*="rounded"]'))
            .filter(Boolean);
          if (!cardEls.length) return;

          const normalize = (r) => ({
            title: r.title,
            description: r.short_description,
            category: r.category,
            match_label: r.match_label,
            link: r.github_url || r.live_url || null,
            tags: (r.tags && r.tags.length) ? r.tags : null
          });
          const entries = dynamicProjects.map(normalize);

          // Use a real card as the stamp for every project — it already
          // carries the exact styling, no Tailwind classes to reconstruct.
          const template = cardEls[0].cloneNode(true);
          template.removeAttribute('data-project-updated');
          template.classList.remove('project-hidden');
          template.querySelectorAll('a.project-link').forEach((a) => a.remove());
          template.classList.add('dyn-project-card');

          const grid = document.createElement('div');
          grid.className = 'dyn-project-grid';

          entries.forEach((entry) => {
            const card = template.cloneNode(true);
            const titleEl = card.querySelector('h3');
            if (titleEl) titleEl.textContent = entry.title;
            const descEl = card.querySelector('div.space-y-2 p');
            if (descEl && entry.description) descEl.textContent = entry.description;
            const categoryEl = card.querySelector('div.space-y-2 > div');
            if (categoryEl && entry.category) categoryEl.textContent = entry.category;
            const spans = card.querySelectorAll('span');
            if (spans[1] && entry.match_label) spans[1].textContent = entry.match_label; // spans[0] is the P01/P02 episode tag, left as-is
            // Tag chips (e.g. "Excel", "SQL") — removed entirely, no chip row shown.
            const chipsContainer = card.querySelector('div.flex-wrap.border-t');
            if (chipsContainer) chipsContainer.remove();
            if (entry.link) {
              const link = document.createElement('a');
              link.className = 'project-link';
              link.href = entry.link;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.textContent = 'View Project ↗';
              card.appendChild(link);
              card.style.cursor = 'pointer';
              card.addEventListener('click', (event) => {
                if (!event.target.closest('a')) window.open(link.href, '_blank', 'noopener,noreferrer');
              });
            }
            observeReveal(card, grid.children.length * 80);
            grid.appendChild(card);
          });

          // Hide the two fixed-slot animated stacks (desktop 3D perspective
          // stack + mobile snap-scroll row — the latter is its own direct
          // child of #projects, not nested inside the perspective wrapper)
          // and drop the plain grid in place.
          const stackHost = cardEls[0].closest('[class*="perspective-"]') || projects;
          [...projects.querySelectorAll('[class*="transform-style-3d"], [class*="hide-scrollbar"]')].forEach((el) => {
            el.classList.add('project-hidden');
          });
          stackHost.style.height = 'auto';
          projects.style.minHeight = 'auto';
          stackHost.appendChild(grid);
        };

        // ---- Certificates (fully dynamic — any number of cards; always applies,
        // same as before Supabase existed) ----
        const applyCertificates = (dynamicCertificates) => {
          const certificates = document.querySelector('#certificates');
          if (!certificates || certificates.dataset.resumeUpdated) return;
          certificates.dataset.resumeUpdated = 'true';
          const fallback = [
            { title: 'Excel Using AI Workshop', issuer: 'OfficeMaster', issued_date: 'Issued November 9, 2025', link: 'https://lnkd.in/p/dj6cF9WV' },
            { title: 'PowerBI Workshop', issuer: 'OfficeMaster', issued_date: 'Issued September 7, 2025', link: 'https://lnkd.in/p/ddxc7jqn' }
          ];
          const normalize = (r) => ({
            title: r.title,
            issuer: r.issuer,
            issued_date: r.date_label || (r.issue_date ? new Date(r.issue_date).getFullYear().toString() : ''),
            link: r.credential_url || null
          });
          const items = (dynamicCertificates && dynamicCertificates.length) ? dynamicCertificates.map(normalize) : fallback;
          const cardsHtml = items.map((c) => `
            <a class="cert-card" href="${c.link || '#'}" target="_blank" rel="noopener noreferrer">
              <p class="cert-label">VERIFIED CERTIFICATE</p>
              <h3></h3>
              <p></p>
              <p></p>
              <p class="cert-link">View Certificate ↗</p>
            </a>`).join('');
          certificates.innerHTML = `
            <div class="resume-certificates">
              <p class="cert-label">PROFESSIONAL CREDENTIALS</p>
              <h2 class="cert-heading">Certi<span>ficates</span></h2>
              <div class="cert-grid">${cardsHtml}</div>
            </div>`;
          // Set text via textContent (not string interpolation) so titles/issuers can't break the markup.
          const cardEls = [...certificates.querySelectorAll('.cert-card')];
          cardEls.forEach((el, i) => {
            const item = items[i];
            el.querySelector('h3').textContent = item.title;
            const paras = el.querySelectorAll('p');
            paras[1].textContent = item.issuer;
            paras[2].textContent = item.issued_date;
            observeReveal(el, i * 80);
          });
        };

        // ---- Skills (replaces the built-in section only if Supabase has data; otherwise untouched) ----
        const applySkills = (dynamicSkillGroups, profile) => {
          const skills = document.querySelector('#skills');
          if (!skills || skills.dataset.resumeUpdated || !dynamicSkillGroups || !dynamicSkillGroups.length) return;
          skills.dataset.resumeUpdated = 'true';
          skills.classList.add('dynamic-skills');
          skills.innerHTML = `
            <div class="dyn-skills-wrap">
              <h2 class="dyn-skills-heading"></h2>
              <p class="dyn-skills-sub">Practical, job-ready skills across spreadsheets, databases, visualization, and analysis.</p>
              <div class="dyn-skill-cards"></div>
            </div>`;
          skills.querySelector('.dyn-skills-heading').textContent = (profile && profile.skills_heading) || 'Technologies I Work With';
          const container = skills.querySelector('.dyn-skill-cards');
          dynamicSkillGroups.forEach((cat) => {
            const card = document.createElement('div');
            card.className = 'dyn-skill-card';
            const h3 = document.createElement('h3');
            h3.textContent = cat.category;
            const chips = document.createElement('div');
            chips.className = 'dyn-skill-chips';
            (cat.skills || []).forEach((skill) => {
              const chip = document.createElement('span');
              chip.className = 'dyn-skill-chip';
              chip.textContent = skill;
              chips.appendChild(chip);
            });
            card.appendChild(h3);
            card.appendChild(chips);
            container.appendChild(card);
          });
        };

        // dynamicData stays null until the Supabase fetch settles. Every section
        // below is only ever rendered once (each guarded by its own resumeUpdated
        // flag), and that render is deliberately held back until dynamicData is
        // available, so database content (if any) is what actually shows — not a
        // fallback that then can't be replaced. When Supabase isn't configured,
        // fetchDynamicContent() resolves almost immediately with nulls, so this
        // costs no real time in that case.
        // ---- Resume gate: a "Download Resume" button in the hero. Clicking it
        // asks for full name, mobile and email, saves them to Supabase
        // (resume_requests — only you can read them, in the admin), then opens
        // the resume PDF (profile.resume_url if set, otherwise /resume.pdf). ----
        // Email alert to you for every submission (free Web3Forms). Paste your access key between the quotes.
        const WEB3FORMS_KEY = 'ca04985e-6649-4aa9-a052-8e80de4e6631';
        const notifyOwner = (name, mobile, email, company, website) => {
          const key = (CFG && CFG.WEB3FORMS_KEY) || WEB3FORMS_KEY;
          if (!key || key.indexOf('PASTE') === 0) return;
          try {
            fetch('https://api.web3forms.com/submit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({ access_key: key, subject: 'Resume viewed: ' + name, from_name: 'Portfolio resume form',
                name, phone: mobile, email, company, website, message: 'Name: ' + name + '\nFrom: ' + (company || '-') + '\nWebsite: ' + (website || '-') + '\nMobile: ' + mobile + '\nEmail: ' + email })
            }).catch(() => {});
          } catch (_) {}
        };
        let resumeGateApplied = false;
        const applyResumeGate = () => {
          if (resumeGateApplied) return;
          const row = document.querySelector('#home a[href="#contact"], #home a[data-cta="2"]');
          if (!row || !row.parentElement) return;
          resumeGateApplied = true;

          const btn = row.cloneNode(false);
          btn.className = row.className;
          btn.removeAttribute('href'); btn.removeAttribute('data-cta');
          btn.setAttribute('role', 'button'); btn.setAttribute('tabindex', '0');
          btn.style.cursor = 'pointer';
          btn.textContent = 'Download Resume';
          row.parentElement.style.flexWrap = 'wrap';
          row.parentElement.appendChild(btn);

          const overlay = document.createElement('div');
          overlay.className = 'rg-overlay';
          overlay.innerHTML = `
            <form class="rg-box" novalidate>
              <button type="button" class="rg-x" aria-label="Close">&times;</button>
              <h3>View my resume</h3>
              <p class="rg-sub">Enter your details to open the resume.</p>
              <label for="rg-name">Full name</label><input id="rg-name" type="text" autocomplete="name" maxlength="100">
              <label for="rg-mobile">Mobile number</label><input id="rg-mobile" type="tel" autocomplete="tel" inputmode="tel" maxlength="20">
              <label for="rg-email">Email</label><input id="rg-email" type="email" autocomplete="email" maxlength="150">
              <label for="rg-company">From (company / name) <span style="opacity:.55;text-transform:none;letter-spacing:0">- optional</span></label><input id="rg-company" type="text" autocomplete="organization" maxlength="150">
              <label for="rg-website">Website URL <span style="opacity:.55;text-transform:none;letter-spacing:0">- optional</span></label><input id="rg-website" type="text" inputmode="url" autocomplete="url" placeholder="https://" maxlength="250">
              <input class="rg-hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
              <div class="rg-err" role="alert"></div>
              <button type="submit" class="rg-go">Open resume</button>
            </form>`;
          document.body.appendChild(overlay);
          const form = overlay.querySelector('form');
          const err = overlay.querySelector('.rg-err');
          const go = overlay.querySelector('.rg-go');
          const hp = overlay.querySelector('.rg-hp');
          const open = () => { overlay.classList.add('on'); setTimeout(() => form.querySelector('#rg-name').focus(), 50); };
          const close = () => overlay.classList.remove('on');
          btn.addEventListener('click', open);
          btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
          // Private share link: https://venkata-sai143.github.io/#resume opens this popup straight away.
          if (/(^#resume$)|([?&]resume(=|&|$))/i.test(location.hash + location.search)) setTimeout(open, 600);
          window.addEventListener('hashchange', () => { if (/^#resume$/i.test(location.hash)) open(); });
          overlay.querySelector('.rg-x').addEventListener('click', close);
          overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
          document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            err.textContent = '';
            const name = form.querySelector('#rg-name').value.trim().replace(/\s+/g, ' ');
            const mobile = form.querySelector('#rg-mobile').value.trim();
            const email = form.querySelector('#rg-email').value.trim();
            const company = form.querySelector('#rg-company').value.trim().replace(/\s+/g, ' ');
            let website = form.querySelector('#rg-website').value.trim();
            const digits = mobile.replace(/\D/g, '');
            if (name.length < 2) return (err.textContent = 'Please enter your full name.');
            if (!/^\+?[0-9\s\-()]+$/.test(mobile) || digits.length < 7 || digits.length > 15) return (err.textContent = 'Please enter a valid mobile number.');
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return (err.textContent = 'Please enter a valid email address.');
            if (website && !/^https?:\/\//i.test(website)) website = 'https://' + website;
            if (website && !/^https?:\/\/[^\s.]+\.[^\s]{2,}$/i.test(website)) return (err.textContent = 'Please enter a valid website URL, or leave it empty.');
            const resumeUrl = (dynamicData && dynamicData.profile && dynamicData.profile.resume_url) || '/resume-vs-2026x9.pdf';
            if (hp.value) { window.open(resumeUrl, '_blank', 'noopener'); return close(); } // bots: skip saving
            if (!hasSupabase) return (err.textContent = 'Could not save your details right now. Please try again later.');
            // Open the PDF straight away (works on phones too), and save the details in the background.
            const opened = window.open(resumeUrl, '_blank');
            if (!opened) window.location.href = resumeUrl;
            try {
              const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
              sb.from('resume_requests').insert({ full_name: name, mobile, email, company: company || null, website: website || null })
                .then(() => notifyOwner(name, mobile, email, company, website), () => notifyOwner(name, mobile, email, company, website));
            } catch (_) { notifyOwner(name, mobile, email, company, website); }
            form.reset(); close();
          });
        };

        let dynamicData = null;

        const applyAll = () => {
          if (!dynamicData) return false;
          applyProfile(dynamicData.profile);
          applyExperience(dynamicData.experiences);
          applyExpertise(dynamicData.expertise);
          applyProjects(dynamicData.projects);
          applyCertificates(dynamicData.certificates);
          applySkills(dynamicData.skills, dynamicData.profile);
          return Boolean(
            document.querySelector('#about') &&
            document.querySelector('#experience') &&
            document.querySelector('#expertise') &&
            document.querySelector('#projects') &&
            document.querySelector('#certificates') &&
            document.querySelector('#skills')
          );
        };

        const observer = new MutationObserver(() => {
          applyPremiumMotion();
          applyResumeGate();
          if (applyAll()) observer.disconnect();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        fetchDynamicContent().then((data) => {
          dynamicData = data;
          applyPremiumMotion();
          applyResumeGate();
          if (applyAll()) observer.disconnect();
        });
      })();
    </script>
  </body>
</html>
